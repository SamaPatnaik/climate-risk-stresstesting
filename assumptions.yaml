# Every model parameter, its value, source, and whether it is a placeholder.
# placeholder: true  -> judgment call, not sourced; candidate for sensitivity analysis.
# proxy: true        -> sourced, but measures something close to (not exactly) the model input.
# Code reads only `value`; everything else is documentation served at /api/assumptions.

portfolio:
  seed:
    value: 20261006
    source: Arbitrary; fixes the synthetic portfolio for reproducibility.
    placeholder: false
  n_loans:
    value: 100000
    unit: loans
    source: >-
      Sized as a mid-size lender: ~15% of the 686,228 BC residential mortgages held by
      reporting banks (CBA, Number of Residential Mortgages in Arrears, month ended July 31, 2026).
    url: https://cba.ca/mortgages-in-arrears
    placeholder: true
  allocation_weight:
    value: owner_households x pct_owners_with_mortgage
    source: >-
      Statistics Canada, Census Profile 2021 (98-401-X2021004), characteristics 1415 (Owner)
      and 1483 (% of owner households with a mortgage), 25% sample data.
    url: https://www150.statcan.gc.ca/n1/en/catalogue/98-401-X2021004
    placeholder: false
    note: Loans are allocated to census divisions by multinomial draw with these weights.
  balance_mean:
    value: 380000
    unit: CAD
    source: >-
      Approximate BC average outstanding mortgage balance reported in secondary sources
      citing Equifax/CMHC data (2026). Primary CMHC/Equifax table not yet confirmed.
    placeholder: true
  balance_sigma:
    value: 0.6
    unit: log-CAD
    source: Shape of the lognormal balance distribution; judgment.
    placeholder: true
  balance_value_elasticity:
    value: 0.5
    source: >-
      Division mean balance = balance_mean x (median_dwelling_value / BC weighted mean)^elasticity.
      Median dwelling value from Census Profile 2021, characteristic 1488. Elasticity < 1 because
      higher-value markets also carry more equity; the value 0.5 is judgment.
    placeholder: true
  insured_share:
    value: 0.23
    unit: share of outstanding balances (CAD)
    source: >-
      Bank of Canada, Funds advanced and outstanding balances for new and existing lending by
      chartered banks, July 2026 month-end book values: insured residential mortgages $378,001M
      (V122667736), uninsured $1,254,149M (V122667742); 378,001 / 1,632,150 = 23.2%.
      Cross-check: CMHC Residential Mortgage Industry Report, Fall 2024 - 74% of outstanding
      residential mortgages at chartered banks uninsured in 2024 H1 (basis not stated).
    url: https://www.bankofcanada.ca/rates/banking-and-financial-statistics/funds-advanced-and-outstanding-balances-for-new-and-existing-lending-by-chartered-banks/
    placeholder: false
    proxy: true
    note: >-
      National, by dollar value; no BC breakdown in this series. Applied per loan independently
      of balance, so the portfolio's insured share by count and by dollars are both ~23%. In
      reality insured loans skew smaller (insurance is unavailable above a price cap), so the
      real count share is higher than the dollar share, and the BC share likely lower.
  pd_base:
    value: 0.0026
    unit: annual probability
    source: >-
      BC share of bank residential mortgages 90+ days in arrears, 0.26%
      (CBA, month ended July 31, 2026).
    url: https://cba.ca/mortgages-in-arrears
    placeholder: false
    proxy: true
    note: A point-in-time arrears stock, not a 12-month default rate. Used as a proxy for annual PD.
  lgd_base_uninsured:
    value: 0.20
    unit: share of EAD
    source: Judgment, set above the 10% regulatory floor below.
    placeholder: true
  lgd_floor:
    value: 0.10
    unit: share of EAD
    source: >-
      OSFI Capital Adequacy Requirements (2026), Chapter 5 (IRB approach), para. 146: "The LGD
      floor for residential mortgages is fixed at 10% irrespective of the level of collateral
      provided by the property." [Basel Framework CRE 32.58]. Para. 147: the floor does not apply
      to any portion guaranteed or insured by the Government of Canada.
    url: https://www.osfi-bsif.gc.ca/en/guidance/guidance-library/capital-adequacy-requirements-car-2026-chapter-5-credit-risk-internal-ratings-based-approach
    placeholder: false
    note: >-
      Applied to uninsured loans only, consistent with para. 147. Not modelled: the separate
      downturn LGD (DLGD) floor for new Canadian residential real estate exposures (para. 289),
      which adds an LTV- and house-price-correction-based add-on; this needs loan-level LTVs.
      This is a regulatory capital floor, used here as a sanity bound on a stress-test LGD.
  lgd_base_insured:
    value: 0.0
    unit: share of EAD
    source: >-
      Credit loss on insured mortgages is transferred to the mortgage insurer (CMHC or private),
      so the lender's LGD is ~0. Ignores claim haircuts and admin costs, and the 10% deductible
      portion of privately insured loans not covered by the Government of Canada backstop
      (OSFI CAR 2026, Ch. 5, para. 147).
    placeholder: true

model:
  hazard_headroom:
    value: 2.0
    source: >-
      h = burn share / (headroom x worst single CD-year burn share on record). The worst CD-year
      (Northern Rockies 2023, ~14.6% of land burned) maps to h = 0.5; a CD's hazard_score is the
      mean of its yearly h. Headroom equals the largest scenario multiplier (hot_house), so
      H = min(1, h x m) never saturates on observed data in any year or scenario. PD is then
      linear in h (so the PD calibration below is exact); EL is quadratic in h because the PD
      and LGD uplifts multiply, so expected EL is averaged over fire seasons, not evaluated at
      the mean hazard.
    placeholder: false
  pd_calibration:
    value: historical_climate
    source: >-
      pd_base (0.26%, CBA BC 90+ day arrears) is observed under today's climate, so it is treated
      as the portfolio PD at the reference scenario (m = 1, historical hazard), not as a
      no-climate PD. The model uses a no-climate intercept
        PD_0 = pd_base / mean over loans of (1 + E[beta_pd] x h_cd)
      so that the loan-count-weighted mean PD at m = 1 equals pd_base exactly. Loan-count
      weighting matches the CBA measure (% of number of mortgages). Calibrated at the
      portfolio level (not per CD), so cross-CD hazard differences are preserved.
      LGD_base is not recalibrated: it is a judgment placeholder, interpreted as no-climate LGD.
    placeholder: false
  beta_pd:
    value: {dist: lognormal, median: 2.0, sigma: 0.5}
    source: >-
      Judgment: PD = PD_0 x (1 + beta_pd x H). At the median, the worst CD-year on record under
      historical climate (H = 0.5) doubles PD; the same year under Hot House (H = 1) triples it.
      No public data links Canadian mortgage default to wildfire; see stretch goal S1.
    placeholder: true
  beta_lgd:
    value: {dist: lognormal, median: 0.15, sigma: 0.5}
    source: Judgment; additive LGD uplift at H = 1 and vulnerability = 1.
    placeholder: true
  climate_lgd_applies_to_insured:
    value: false
    source: Insurer absorbs collateral shortfall on insured loans.
    placeholder: true

simulation:
  seed:
    value: 4242
    source: Arbitrary; separate from the portfolio seed so the book stays fixed while runs vary.
    placeholder: false
  n_runs:
    value: 1000
    source: >-
      Monte Carlo runs per scenario. ES_99 averages the worst 1% = 10 runs; the standard error
      of the mean is reported alongside it.
    placeholder: false
  fire_season_bootstrap:
    value: uniform over window years
    source: >-
      Each run draws one historical year (1990-2025, equal weights) and uses that year's
      burn share in every CD, so spatially correlated bad seasons (2017, 2018, 2021, 2023) hit
      many CDs in the same run. The same year, betas and default uniforms are shared across
      scenarios within a run (common random numbers), so scenario differences are not noise.
    placeholder: false
    note: >-
      Equal weights treat 1990s seasons as being as likely as recent ones; the recent decade burned
      far more. Window choice is tested in the sensitivity analysis (M5).

# One-at-a-time sensitivity (M5). Each parameter moves to `low` and `high` with all others at
# base. Metric: Hot House EL and ES_99 uplift vs historical for the BC portfolio.
sensitivity:
  beta_pd_median:
    value: {low: 1.0, high: 3.0}
    source: Judgment; half and 1.5x the base median (2.0). Sigma unchanged.
    placeholder: true
  beta_lgd_median:
    value: {low: 0.075, high: 0.30}
    source: Judgment; half and double the base median (0.15). Sigma unchanged.
    placeholder: true
  pd_base:
    value: {low: 0.0011, high: 0.0063}
    source: >-
      Range of BC annual-average 90+ day arrears rates, 1995-2025: low 0.11% (2022), high 0.63%
      (2001). CBA, Number of Residential Mortgages in Arrears, historical series by region
      (month ended July 31, 2026 release). Same proxy caveat as pd_base.
    url: https://cba.ca/mortgages-in-arrears
    placeholder: false
  lgd_base_uninsured:
    value: {low: 0.10, high: 0.35}
    source: Low = OSFI 10% LGD floor (CAR 2026 Ch. 5 para. 146); high = judgment.
    placeholder: true
  hot_house_multiplier:
    value: {low: 1.6, high: 2.5}
    source: >-
      Low = the current_policies multiplier; high = judgment. Above hazard_headroom (2.0) the
      cap H = min(1, h x m) starts to bind in the worst CD-years.
    placeholder: true
  hazard_headroom:
    value: {low: 1.5, high: 3.0}
    source: >-
      Hazard scale: the burn share that maps to h = 1 is headroom x the worst CD-year. Lower
      headroom = larger h for the same fire (and, at 1.5 under Hot House, saturation in the
      worst CD-years). Judgment range.
    placeholder: true
  fire_window:
    value: {low: [1990, 2025], high: [2015, 2025]}
    source: >-
      Which fire seasons define historical climate (and are bootstrapped). Low = base window;
      high = the last 11 seasons, which include 2017, 2018, 2021 and 2023-2025. The hazard
      reference (worst CD-year, Northern Rockies 2023) is in both windows, so only the set of
      seasons changes. PD_0 is recalibrated so the observed PD still holds at historical climate.
    placeholder: false

reporting:
  min_loans_for_tail:
    value: 100
    unit: loans per census division
    source: >-
      Judgment. With pd_base ~0.26%, a CD with fewer than 100 loans expects < 0.3 defaults per
      run, so its simulated loss distribution is mostly zeros and a few single-loan jumps;
      p95/p99/ES are then artefacts of loan granularity, not risk. Below this threshold the
      CD's tail measures are suppressed (mean EL is still reported, flagged as low-count).
      The CD's loans remain in the BC portfolio total, whose tails are always reported.
    placeholder: true

# ILLUSTRATIVE ONLY. Stylized hazard multipliers, NOT NGFS model output.
# Ordering follows NGFS physical-risk logic: physical risk is lowest in Orderly, similar
# in Disorderly (which differs mainly in transition risk, out of scope), higher under
# Current Policies, highest in Hot House World.
scenarios:
  historical:
    value: 1.0
    label: Historical climate (reference, 1990-2025 fire seasons)
    source: >-
      Reference scenario: observed hazard, no scaling. All climate uplifts are reported relative
      to this scenario; EL with no wildfire hazard (H = 0) is kept as a secondary column.
    placeholder: false
  orderly:
    value: 1.2
    label: Orderly (Net Zero 2050-like)
    placeholder: true
  disorderly:
    value: 1.3
    label: Disorderly (Delayed Transition-like)
    placeholder: true
  current_policies:
    value: 1.6
    label: Current Policies
    placeholder: true
  hot_house:
    value: 2.0
    label: Hot House World
    placeholder: true
